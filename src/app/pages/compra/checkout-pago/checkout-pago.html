<div class="contenedor pagina">
  <h1 class="sr-only">Pago: método de pago</h1>
  <pasos-checkout [actual]="2" />

  <div class="checkout">
    <form class="pago" (submit)="$event.preventDefault()">
      <fieldset>
        <legend class="titulo-3">¿Cómo quieres pagar?</legend>
        <div class="metodos">
          <label class="opcion-tarjeta">
            <input type="radio" name="metodo" value="tarjeta" checked />
            <span class="radio" aria-hidden="true"></span>
            <span class="contenido">
              <strong
                ><app-icono nombre="tarjeta" [tamano]="18" /> Tarjeta de crédito
                o débito</strong
              >
              <span class="texto-sec pequeno"
                >Visa, Mastercard, American Express</span
              >
            </span>
          </label>
          <label class="opcion-tarjeta">
            <input type="radio" name="metodo" value="paypal" />
            <span class="radio" aria-hidden="true"></span>
            <span class="contenido">
              <strong
                ><app-icono nombre="cartera" [tamano]="18" /> PayPal</strong
              >
              <span class="texto-sec pequeno"
                >Te llevaremos a PayPal para terminar</span
              >
            </span>
          </label>
        </div>
      </fieldset>

      <fieldset class="datos-tarjeta">
        <legend class="titulo-3">Datos de la tarjeta</legend>
        <div class="campo">
          <label for="tarjeta-numero">Número de tarjeta *</label>
          <input
            id="tarjeta-numero"
            name="numero"
            inputmode="numeric"
            autocomplete="cc-number"
            pattern="[0-9 ]{15,19}"
            maxlength="19"
            placeholder="1234 5678 9012 3456"
            required
          />
        </div>
        <div class="campo">
          <label for="tarjeta-titular">Nombre del titular *</label>
          <input
            id="tarjeta-titular"
            name="titular"
            autocomplete="cc-name"
            maxlength="120"
            required
          />
        </div>
        <div class="fila-2">
          <div class="campo">
            <label for="tarjeta-vence">Vencimiento *</label>
            <input
              id="tarjeta-vence"
              name="vencimiento"
              inputmode="numeric"
              autocomplete="cc-exp"
              pattern="(0[1-9]|1[0-2])/[0-9]{2}"
              maxlength="5"
              placeholder="MM/AA"
              required
            />
          </div>
          <div class="campo">
            <label for="tarjeta-cvv">CVV *</label>
            <input
              id="tarjeta-cvv"
              name="cvv"
              inputmode="numeric"
              autocomplete="cc-csc"
              pattern="[0-9]{3,4}"
              maxlength="4"
              required
            />
            <span class="ayuda">3 o 4 dígitos al reverso</span>
          </div>
        </div>
        <label class="casilla"
          ><input type="checkbox" name="guardar" /> Guardar tarjeta para futuras
          compras</label
        >
      </fieldset>

      <div class="aviso aviso-info paypal-aviso">
        <app-icono nombre="info" [tamano]="18" />
        <span
          >Al confirmar el pedido se abrirá PayPal para que autorices el
          pago.</span
        >
      </div>

      <p class="aviso aviso-suave">
        <app-icono nombre="candado" [tamano]="18" /> Tus datos viajan cifrados.
        No guardamos el CVV.
      </p>

      <div class="checkout__acciones">
        <a routerLink="/checkout/direccion" class="btn btn-fantasma"
          ><app-icono nombre="izquierda" [tamano]="16" /> Volver</a
        >
        <a routerLink="/checkout/confirmar" class="btn btn-primario"
          >Revisar pedido</a
        >
      </div>
    </form>

    <app-resumen-pedido />
  </div>
</div>
