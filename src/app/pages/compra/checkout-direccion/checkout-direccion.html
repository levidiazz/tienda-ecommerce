<div class="contenedor pagina">
  <h1 class="sr-only">Pago: dirección de envío</h1>
  <pasos-checkout [actual]="1" />

  <div class="checkout">
    <form (submit)="$event.preventDefault()">
      <fieldset>
        <legend class="titulo-3">¿A dónde enviamos tu pedido?</legend>
        <div class="direcciones">
          @for (d of direcciones; track d.alias; let i = $index) {
          <label class="opcion-tarjeta">
            <input
              type="radio"
              name="direccion"
              [value]="d.alias"
              [checked]="d.principal"
              required
            />
            <span class="radio" aria-hidden="true"></span>
            <span class="contenido">
              <span class="titulo-direccion">
                <strong>{{ d.alias }}</strong>
                @if (d.principal) {
                <span class="insignia insignia-suave">Principal</span> }
              </span>
              <span>{{ d.receptor }}</span>
              <span class="texto-sec">{{ d.calle }}</span>
              <span class="texto-sec">{{ d.ciudad }}</span>
              <span class="texto-sec">Tel. {{ d.telefono }}</span>
            </span>
          </label>
          }
        </div>
      </fieldset>
      <button
        type="button"
        class="btn btn-secundario agregar"
        (click)="formularioAbierto.set(true)"
      >
        <app-icono nombre="mas" [tamano]="16" /> Agregar nueva dirección
      </button>

      <fieldset class="envio">
        <legend class="titulo-3">Método de envío</legend>
        <label class="opcion-tarjeta">
          <input type="radio" name="envio" value="estandar" checked />
          <span class="radio" aria-hidden="true"></span>
          <span class="contenido">
            <strong>Envío estándar · $99.00</strong>
            <span class="texto-sec">Llega de 3 a 5 días hábiles</span>
          </span>
        </label>
      </fieldset>

      <div class="checkout__acciones">
        <a routerLink="/carrito" class="btn btn-fantasma"
          ><app-icono nombre="izquierda" [tamano]="16" /> Volver al carrito</a
        >
        <a routerLink="/checkout/pago" class="btn btn-primario"
          >Continuar al pago</a
        >
      </div>
    </form>

    <app-resumen-pedido [mostrarProductos]="true" />
  </div>
</div>

@if (formularioAbierto()) {
<app-modal
  titulo="Agregar nueva dirección"
  subtitulo="Se guardará en tu cuenta"
  (cerrar)="formularioAbierto.set(false)"
>
  <formulario-direccion
    (guardar)="formularioAbierto.set(false)"
    (cancelar)="formularioAbierto.set(false)"
  />
</app-modal>
}
