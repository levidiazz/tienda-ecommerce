<div class="contenedor acceso">
  <section class="acceso__tarjeta ancha" aria-labelledby="titulo-registro">
    <header>
      <h1 id="titulo-registro" class="titulo-1">Crear cuenta</h1>
      <p class="texto-sec">Regístrate para comprar y dar seguimiento a tus pedidos.</p>
    </header>
    <form class="formulario" (submit)="$event.preventDefault()">
      <div class="campo">
        <label for="reg-nombre">Nombre(s) *</label>
        <input id="reg-nombre" name="nombre" autocomplete="given-name" maxlength="80" required>
      </div>
      <div class="fila-2">
        <div class="campo">
          <label for="reg-paterno">Apellido paterno *</label>
          <input id="reg-paterno" name="apellidoPaterno" autocomplete="family-name" maxlength="80" required>
        </div>
        <div class="campo">
          <label for="reg-materno">Apellido materno</label>
          <input id="reg-materno" name="apellidoMaterno" maxlength="80">
        </div>
      </div>
      <div class="campo">
        <label for="reg-correo">Correo electrónico *</label>
        <input id="reg-correo" name="correo" type="email" autocomplete="email" maxlength="150" required>
      </div>
      <div class="fila-2">
        <div class="campo">
          <label for="reg-telefono">Teléfono</label>
          <input id="reg-telefono" name="telefono" type="tel" inputmode="tel" pattern="[0-9 ]{10,14}" autocomplete="tel">
        </div>
        <div class="campo">
          <label for="reg-nacimiento">Fecha de nacimiento *</label>
          <input id="reg-nacimiento" name="fechaNacimiento" type="date" autocomplete="bday" required>
        </div>
      </div>
      <div class="campo">
        <label for="reg-clave">Contraseña *</label>
        <input id="reg-clave" name="contrasena" type="password" autocomplete="new-password" minlength="8" required aria-describedby="reg-clave-ayuda">
        <span id="reg-clave-ayuda" class="ayuda">Mínimo 8 caracteres, con una mayúscula y un número</span>
      </div>
      <div class="campo">
        <label for="reg-clave2">Confirmar contraseña *</label>
        <input id="reg-clave2" name="confirmarContrasena" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <label class="casilla"><input type="checkbox" name="terminos" required> Acepto los términos y el aviso de privacidad</label>
      <label class="casilla"><input type="checkbox" name="boletin"> Quiero recibir ofertas por correo</label>
      <a routerLink="/cuenta/pedidos" class="btn btn-primario btn-bloque">Crear cuenta</a>
    </form>
    <p class="acceso__pie">¿Ya tienes cuenta? <a routerLink="/cuenta/iniciar-sesion">Inicia sesión</a></p>
  </section>
</div>
